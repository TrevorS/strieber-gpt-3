# =============================================================================
# Authelia Configuration - strieber-gpt-3
# =============================================================================
# Minimal config for TOTP + WebAuthn with file-based users

server:
  address: 'tcp://:9091'

log:
  level: info

# File-based users (see users.yml)
authentication_backend:
  file:
    path: /config/users.yml

# Session cookies
session:
  secret: '${AUTHELIA_SESSION_SECRET}'
  cookies:
    - domain: 'strieber.org'
      authelia_url: 'https://auth.strieber.org'
      default_redirection_url: 'https://chat.strieber.org'
      name: 'authelia_session'
      same_site: 'lax'
      inactivity: '1h'
      expiration: '24h'
      remember_me: '1M'

# SQLite storage for credentials and sessions
storage:
  encryption_key: '${AUTHELIA_STORAGE_ENCRYPTION_KEY}'
  local:
    path: /data/db.sqlite3

# TOTP (authenticator apps)
totp:
  issuer: 'strieber.org'

# WebAuthn (passkeys, YubiKey, etc.)
webauthn:
  display_name: 'Strieber Chat'

# Access control - two_factor required for MFA to appear
access_control:
  default_policy: 'deny'
  rules:
    - domain: 'chat.strieber.org'
      policy: 'two_factor'

# File-based notifications (no SMTP)
notifier:
  filesystem:
    filename: /data/notifications.txt

# JWT for password reset links
identity_validation:
  reset_password:
    jwt_secret: '${AUTHELIA_JWT_SECRET}'
