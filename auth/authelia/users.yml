# =============================================================================
# Authelia Users Database
# =============================================================================
# Generate password hashes:
#   docker compose --profile auth run --rm authelia authelia crypto hash generate argon2 --password 'YOUR_PASSWORD'

users:
  trevor:
    displayname: 'Trevor'
    # PLACEHOLDER - generate real hash with command above
    password: '$argon2id$v=19$m=65536,t=3,p=4$PLACEHOLDER$REPLACE_THIS_HASH'
    email: 'trevor@strieber.org'
    groups:
      - 'admins'
      - 'users'

