[package]
name = "responses-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = { version = "0.8.7", features = ["macros"] }
dashmap = "6.1.0"
eventsource-stream = "0.2.3"
futures = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "0.9.1", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.7", features = ["cors", "trace", "timeout"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
pretty_assertions = "1.4.1"
